    <script src="../../js/main.js"></script>

    <script>
        function formCheck(form) {
            if(form.userId.value == "") {
                alert('이메일을 입력하세요.')
                return
            }
            if(form.userPw.value == "") {
                alert('비밀번호를 입력하세요.')
                return
            }
            // 데모 로그인: 이메일만 브라우저에 저장하고 마이페이지로 이동 (비밀번호는 저장하지 않음)
            try {
                localStorage.setItem('soha_user', JSON.stringify({ email: form.userId.value.trim() }))
            } catch (error) {}
            alert('로그인 되었습니다.')
            location.href = '../mypage/index.html'
        }
    </script>
